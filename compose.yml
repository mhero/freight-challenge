name: freight

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freight}
      POSTGRES_DB: ${POSTGRES_DB:-freight_development}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-freight}:${POSTGRES_PASSWORD:-freight}@db:5432/${POSTGRES_DB:-freight_development}
      SKIP_TEST_DATABASE: "true"
      FEED_PATH: ${FEED_PATH:-}
    stdin_open: true

volumes:
  pgdata:
